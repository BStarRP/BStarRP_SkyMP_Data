;BStarRP patch - Fabled Forests seasonal trees take priority over Seasonal Landscapes.
;Seasons of Skyrim v1.9.1 loads Data\Seasons\*_AUT.ini sorted by byte-wise (case-sensitive) path,
;and each later file overwrites the same base key (insert_or_assign), so this 'zz' file must sort last.
