[AttackCollisions]
; BStarRP MP tweaks: longer/fatter local weapon capsules (attacker-side).
; Remote PC body colliders are separate — hostility filters don't fix PvP miss.
bAttackCollisionsEnabled = 1
bEnableJumpIframes = 1
bNoPlayerTeammateAttackCollision = 0
; OFF — do not filter by hostility (remote PCs are not reliable "hostiles").
bNoNonHostileAttackCollision = 0
fCombatStateLingerTime = 3
bDisablePhysicalCollisionOnHit = 0
fWeaponLengthMult = 1.2
fWeaponCapsuleRadius = 18
fMinWeaponLength = 40
; Longer active hitbox so a swing can still connect before the next click cancels it.
fDefaultCollisionLifetime = 0.8
fDefaultCollisionLifetimePowerAttackMult = 1.8
fHitSameRefCooldown = 0.3
fHitSameMaterialCooldown = 0.3
fFirstPersonAttackLengthOffset = 0
fPlayerAttackLengthMult = 1.25
fPlayerAttackRadiusMult = 2.0
fMountedAttackLengthMult = 1.5
fMountedAttackRadiusMult = 1.5
; 0 = Unlimited (was 3, out of range for the 0–2 MCM enum).
uSweepAttackMode = 0
uMaxTargetsNoSweepAttack = 1
uMaxTargetsSweepAttack = 0
fSweepAttackDiminishingReturnsFactor = 0.5
fGroundFeetDistanceThreshold = 30

[Trails]
bDisplayTrails = 1
bTrailUseAttackCollisionLength = 0
fTrailSegmentLifetime = 0.1
fTrailFadeOutTime = 0.1
uTrailSegmentsPerSecond = 120
fTrailDefaultBaseColorR = 0.53
fTrailDefaultBaseColorG = 0.53
fTrailDefaultBaseColorB = 0.53
fTrailDefaultBaseColorA = 1
fTrailBaseColorScaleMult = 1

[Hitstop]
; Keep off for MP — hitstop freezes anim and worsens swing cancel races.
bEnableHitstop = 0
bApplyHitstopToTarget = 0
fHitstopDurationNPC = 0.07
fHitstopDurationOther = 0.035
fHitstopSlowdownTimeMultiplier = 0.1
fHitstopDurationPowerAttackMultiplier = 1.3
fHitstopDurationTwoHandedMultiplier = 1.2
fHitstopDurationDiminishingReturnsFactor = 0.5
bEnableHitstopCameraShake = 1
fHitstopCameraShakeStrengthNPC = 6
fHitstopCameraShakeStrengthOther = 4
fHitstopCameraShakeDurationNPC = 0.3
fHitstopCameraShakeDurationOther = 0.3
fHitstopCameraShakeFrequency = 40
fHitstopCameraShakePowerAttackMultiplier = 1.3
fHitstopCameraShakeTwoHandedMultiplier = 1.2
fHitstopCameraShakeDurationDiminishingReturnsFactor = 0.5

[Recoil]
bRecoilPlayer = 1
bRecoilNPC = 1
bRecoilPowerAttack = 1
bUseVanillaRecoil = 0
bRemoveRecoilOnHitframe = 1
fRecoilCollisionLength = 25
bEnableRecoilCameraShake = 1
fRecoilCameraShakeStrength = 10
fRecoilCameraShakeDuration = 0.4
fRecoilCameraShakeFrequency = 40

[HitImpulse]
bApplyImpulseOnHit = 1
bApplyImpulseOnKill = 1
fHitImpulseBaseMult = 1
fHitImpulseBlockMult = 0.6
fHitImpulsePowerAttackMult = 2
fHitImpulseRagdollMult = 1
fHitImpulseKillMult = 1
fHitImpulseBaseStrength = 1
fHitImpulseProportionalStrength = -0.15
fHitImpulseMassExponent = 0.5
fHitImpulseMinStrength = 0.2
fHitImpulseMaxStrength = 1
fHitImpulseMaxVelocity = 1500
fHitImpulseDownwardsMultiplier = 0.5
fHitImpulseDecayMult1 = 0.255
fHitImpulseDecayMult2 = 0.125
fHitImpulseDecayMult3 = 0.075

[Miscellaneous]
fActiveActorDistance = 4000
bHookAIWeaponReach = 1
fAIWeaponReachOffset = 0
bDisableCharacterBumper = 1
bUseRagdollCollisionWhenAllowed = 1

[Debug]
bDebug = 0
bDisplayWeaponCapsule = 0
bDisplayHitNodeCollisions = 0
bDisplayHitLocations = 0
bDisplayIframeHits = 0
bDisplayRecoilCollisions = 0
bDisplaySkeletonColliders = 0
uToggleKey = -1
uReloadSettingsKey = -1
