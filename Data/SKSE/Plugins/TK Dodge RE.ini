[Main]
;EnableDebugLog = true
;Enable Debug Message Printing.

DodgeHotkey = 184
;Right Alt. Held with jump (space) to roll while EnableBlockRoll is true. The key alone does nothing.
;Scan codes: https://www.creationkit.com/index.php?title=Input_Script#DXScanCodes

EnableBlockRoll = true
;Space rolls while blocking, or while DodgeHotkey is held. Space alone still jumps.

BlockJumpWhileDodging = true
;While the roll clip is active (bIsDodging), jump input is swallowed at the JumpHandler.

EnableSprintKeyDodge = false
;Set the dodge perform by tapping sprint button, that will replace the dodge hotkey with sprint key. 
;Require Classic Sprinting Redone (https://www.nexusmods.com/skyrimspecialedition/mods/20166) to work.

StepDodge = false
;Set if perform step dodge instead of rolling dodge, "true" is enable while "false" is disable.

DodgeStamina = 0
;Set the stamina cost when perform dodge. SkyMP server drains TKDodge* — keep this 0 to avoid double-drain.

EnableSneakDodge = false
;Set if allow perfrom dodge when sneaking.

iFrameDuration = 0.3
;Set the duration of invincibility frames. unit : second(s)

EnableDodgeAttackCancel = false
;allow dodge to cancel attacks

EnableDodgeInPlace = false
;Allows to dodge even if the player isn't moving. Dodge direction determined by "defaultDodgeEvent".

defaultDodgeEvent = TKDodgeBack
;Does nothing if "EnableDodgeInPlace" is false
;Default dodge event triggered when not moving. Available options: "TKDodgeForward", "TKDodgeLeft", "TKDodgeRight", "TKDodgeBack"
;Leave it blank may cause CTD,use "EndAnimatedCamera" can disable this feature too.