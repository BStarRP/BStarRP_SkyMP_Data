; Seasons of Skyrim SKSE — SkyMP worldTime calendar
; TimeService writes GameMonth 0–11 (Morning Star = January). Season Type 5 reads that.
; Month → season matches worldTime HUD + northern worldWeather pools.

[Settings]

;0 - disabled
;1 - permanent winter
;2 - permanent spring
;3 - permanent summer
;4 - permanent autumn
;5 - seasonal (GameMonth)
Season Type = 5

;0 - none
;1 - winter
;2 - spring
;3 - summer
;4 - autumn

;January
Morning Star = 1
;February
Sun's Dawn = 1
;March
First Seed = 2
;April
Rain's Hand = 2
;May
Second Seed = 2
;June
Mid Year = 3
;July
Sun's Height = 3
;August
Last Seed = 3
;September
Hearthfire = 4
;October
Frost Fall = 4
;November
Sun's Dusk = 4
;December
Evening Star = 1

Prefer Multipass = true


[Winter]

;Autogenerated winter formswap config will not be applied.
Ignore auto generated WIN formswap = false

;Skip loading these form types from autogenerated winter formswap.
Skip Land Textures = false
Skip Activator = false
Skip Furniture = false
Skip Movable Statics = false
Skip Statics = false
Skip Tree = false

;Valid worldspaces.
Worldspaces = Tamriel|MarkarthWorld|RiftenWorld|SolitudeWorld|WhiterunWorld|DLC1HunterHQWorld|DLC2SolstheimWorld

;Swap objects of these types for seasonal variants.
Activators = true
Furniture = true
Movable Statics = true
Statics = true
Trees = true
Flora = true
Visual Effects = true

;Missing seasonal LOD falls back to the default files.
;Tree LOD: Basic LOD season meshes. Terrain LOD: xLODGen output. Object LOD: no DynDOLOD, so default.
Object LOD = true
Terrain LOD = true
Tree LOD = true

;Enable seasonal grass types (eg. snow grass in winter).
Grass = true


