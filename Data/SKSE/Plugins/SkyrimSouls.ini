[Settings]
;You can use SetSkyrimSoulsVariable(sssv) console command to change menu settings at runtime.
;Format: <SetSkyrimSoulsVariable or sssv> <menuName> <1 or 0>
;Menu name can be one of the following menu names without 'b' prefix.
;Usage example:
;sssv console 1
;sssv SleepWaitMenu 1
;SetSkyrimSoulsVariable SleepWaitMenu 0
bConsole=1
bTutorialMenu=1
bMessageBoxMenu=1
bTweenMenu=1
bInventoryMenu=1
bMagicMenu=1
bContainerMenu=1
bFavoritesMenu=1
bBarterMenu=1
bTrainingMenu=1
bLockpickingMenu=1
bBookMenu=1
bGiftMenu=1
bJournalMenu=1
bLevelUpMenu=1
bStatsMenu=1
bMapMenu=1
bModManagerMenuu=1
bCustomMenu=1
bSleepWaitMenu=1
