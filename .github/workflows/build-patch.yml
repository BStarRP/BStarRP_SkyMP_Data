# Legacy zip attach on release publish.
# Incremental patching (manifest + R2) is handled by "Auto release on patch change".
# Kept so older docs/links still resolve; exits successfully without failing the release.

name: Build patch

on:
  release:
    types: [published]

jobs:
  build-patch:
    # Floating "dev" pointer is manifest/changelog only — nothing to zip.
    if: github.event.release.tag_name != 'dev'
    runs-on: ubuntu-latest
    steps:
      - name: Skip legacy zip (incremental pipeline owns releases)
        run: |
          echo "Skipping legacy patch-*.zip build for tag ${{ github.event.release.tag_name }}."
          echo "Assets ship via Auto release on patch change (manifest.json + R2)."
