# Create a release with version from Conventional Commits when Data/ changes.
# fix: → PATCH, feat: → MINOR, BREAKING CHANGE / ! → MAJOR (https://www.conventionalcommits.org/)
# Builds manifest.json + per-file assets (small on GitHub, large on R2). No zip; launcher uses incremental download only.
#
# Manual run (Actions → "Auto release on patch change" → Run workflow):
# - No version override: updates the *latest* release with manifest + assets (no version bump).
# - With "Create release version" set (e.g. 0.22.0): creates that release (or updates existing) and sets it as latest. Use to fix out-of-wack versions or re-upload after failed runs.

name: Auto release on patch change

on:
  push:
    branches: [main]
    paths:
      - 'Data/**'
      - 'scripts/off-github-assets.json'
      - 'scripts/build-changelog.js'
      - 'scripts/changelog-seed.json'
      - 'scripts/changelog-lib.js'
      - 'scripts/verify-patch-notes-for-release.js'
      - 'patch-notes.md'
  workflow_dispatch:
    inputs:
      create_release_version:
        description: 'Create new release at this version and set as latest (e.g. 0.22.0). Leave empty to just update current latest.'
        required: false
        type: string
      use_previous_version_for_assets:
        description: 'Use this version as "previous" for manifest/R2 copy (e.g. 0.24.5). Use to fix a bad release by re-running and copying from a good one — no full re-upload.'
        required: false
        type: string
      force_upload_all_small_assets:
        description: 'Re-upload ALL assets (GitHub + R2); no copy-from-previous. Use once to repair pointer/wrong files.'
        required: false
        type: boolean
        default: false

jobs:
  auto-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      NODE_OPTIONS: --dns-result-order=ipv4first
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          lfs: false
        # lfs: false = no "git lfs fetch" at checkout, so no LFS bandwidth here.
        # We pull only changed files in "Pull LFS for changed files only" below.

      - name: Setup Git LFS (no fetch yet)
        run: git lfs install --local

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Determine version bump from commits
        id: bump
        if: github.event_name != 'workflow_dispatch'
        run: |
          set -e
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          LOG=$(git log "$LATEST_TAG..HEAD" --format="%s%n%b" || true)
          # Use highest-scope change in range: one feat/fix/breaking triggers a bump; only pure chore = none
          BUMP=none
          # fix: or fix(scope): → at least patch
          if echo "$LOG" | grep -qE '^fix(\([^)]*\))?:'; then
            BUMP=patch
          fi
          # feat: or feat(scope): → at least minor
          if echo "$LOG" | grep -qE '^feat(\([^)]*\))?:'; then
            BUMP=minor
          fi
          # BREAKING CHANGE in body, or type! in subject (e.g. feat!:) → major
          if echo "$LOG" | grep -qi 'BREAKING CHANGE'; then
            BUMP=major
          elif echo "$LOG" | grep -qE '^[a-z]+!.*:'; then
            BUMP=major
          fi
          echo "bump=$BUMP" >> $GITHUB_OUTPUT
          echo "Bump type: $BUMP"

      - name: Get latest version and compute new version
        id: version
        run: |
          LATEST=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          VERSION=${LATEST#v}
          PREV_FOR_ASSETS="${{ github.event.inputs.use_previous_version_for_assets }}"
          if [ -n "$PREV_FOR_ASSETS" ]; then
            # Rebuild/fix: use specified version as previous for manifest fetch and R2 copy (e.g. 0.24.5)
            PREV_TAG="v${PREV_FOR_ASSETS#v}"
            PREV_VER="${PREV_FOR_ASSETS#v}"
            echo "previous_tag=$PREV_TAG" >> $GITHUB_OUTPUT
            echo "previous_version=$PREV_VER" >> $GITHUB_OUTPUT
            echo "Using $PREV_TAG as previous for assets (rebuild/fix mode)"
          else
            PREV_TAG="$LATEST"
            echo "previous_tag=$LATEST" >> $GITHUB_OUTPUT
            echo "previous_version=$VERSION" >> $GITHUB_OUTPUT
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            OVERRIDE="${{ inputs.create_release_version }}"
            if [ -n "$OVERRIDE" ]; then
              echo "Manual run with version override: creating release $OVERRIDE (tag v${OVERRIDE#v}), previous for assets: $PREV_TAG"
              echo "version=$OVERRIDE" >> $GITHUB_OUTPUT
              echo "tag=v${OVERRIDE#v}" >> $GITHUB_OUTPUT
            else
              echo "Manual run: using existing version $VERSION (tag $LATEST)"
              echo "version=$VERSION" >> $GITHUB_OUTPUT
              echo "tag=$LATEST" >> $GITHUB_OUTPUT
            fi
          else
            if [ "${{ steps.bump.outputs.bump }}" = "none" ]; then
              echo "Chore: no version bump, rebuilding current release $VERSION (tag $LATEST)"
              echo "version=$VERSION" >> $GITHUB_OUTPUT
              echo "tag=$LATEST" >> $GITHUB_OUTPUT
            else
              MAJOR=$(echo "$VERSION" | cut -d. -f1)
              MINOR=$(echo "$VERSION" | cut -d. -f2)
              PATCH=$(echo "$VERSION" | cut -d. -f3)
              [[ -z "$PATCH" ]] && PATCH=0
              case "${{ steps.bump.outputs.bump }}" in
                major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
                minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
                patch) PATCH=$((PATCH + 1)) ;;
                *) PATCH=$((PATCH + 1)) ;;
              esac
              NEW_VERSION="$MAJOR.$MINOR.$PATCH"
              echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
              echo "tag=v$NEW_VERSION" >> $GITHUB_OUTPUT
              echo "New version: $NEW_VERSION (tag v$NEW_VERSION)"
            fi
          fi

      - name: Prepare patch notes from patch-notes.md
        id: notes
        run: |
          if [ -f patch-notes.md ]; then
            cp patch-notes.md release-notes.md
            echo "Using patch-notes.md for release and manifest notes"
          else
            echo "No patch-notes.md; generating notes from commit messages"
            LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
            NOTES=""
            FEATURES=""
            FIXES=""
            BREAKING=""
            while IFS= read -r subject; do
              [[ -z "$subject" ]] && continue
              desc=$(echo "$subject" | sed -E 's/^[a-z]+(\([^)]*\))?!?:\s*//')
              if echo "$subject" | grep -qiE '^[a-z]+!.*:' || echo "$subject" | grep -qi 'BREAKING'; then
                BREAKING="$BREAKING- $desc"$'\n'
              elif echo "$subject" | grep -qE '^feat(\([^)]*\))?:'; then
                FEATURES="$FEATURES- $desc"$'\n'
              elif echo "$subject" | grep -qE '^fix(\([^)]*\))?:'; then
                FIXES="$FIXES- $desc"$'\n'
              else
                FIXES="${FIXES}- $desc"$'\n'
              fi
            done < <(git log "$LATEST_TAG..HEAD" --format="%s" --reverse -- Data/ 2>/dev/null || true)
            [[ -n "$BREAKING" ]] && NOTES="${NOTES}## Breaking Changes"$'\n'$'\n'"$BREAKING"$'\n'
            [[ -n "$FEATURES" ]] && NOTES="${NOTES}## Features"$'\n'$'\n'"$FEATURES"$'\n'
            [[ -n "$FIXES" ]] && NOTES="${NOTES}## Fixes"$'\n'$'\n'"$FIXES"
            echo -n "$NOTES" > release-notes.md
          fi
          # Strip leading "Patch X.Y.Z" or "# Patch X.Y.Z" so release description doesn't duplicate the title
          node -e "
            const fs = require('fs');
            const path = 'release-notes.md';
            let s = fs.readFileSync(path, 'utf8');
            const stripped = s.replace(/^#?\s*Patch\s+[\d.]+\s*\n?/i, '').trimStart();
            if (stripped !== s) {
              fs.writeFileSync(path, stripped, 'utf8');
              console.log('Removed duplicate Patch version line from release notes');
            }
          "
          cat release-notes.md

      - name: Fetch previous release manifest and changelog
        if: steps.version.outputs.previous_tag != '' && steps.version.outputs.previous_tag != 'v0.0.0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release download "${{ steps.version.outputs.previous_tag }}" --pattern "manifest.json" --dir . --clobber 2>/dev/null; then
            mv manifest.json prev-manifest.json
            echo "Fetched previous manifest for ${{ steps.version.outputs.previous_tag }}"
          else
            echo "Previous release or manifest not found; will do full LFS pull and upload all assets"
          fi
          if gh release download "${{ steps.version.outputs.previous_tag }}" --pattern "changelog.json" --dir . --clobber 2>/dev/null; then
            mv changelog.json prev-changelog.json
            echo "Fetched previous changelog for ${{ steps.version.outputs.previous_tag }}"
          else
            echo "No previous changelog.json; will use scripts/changelog-seed.json until first changelog is published"
          fi

      - name: Pull LFS for changed and new files only (no reference to reuse)
        env:
          GIT_LFS_SKIP_SMUDGE: '0'
        run: |
          if [ ! -f prev-manifest.json ]; then
            echo "No previous manifest; pulling all LFS objects for current ref"
            git lfs pull
          else
            PREV="${{ steps.version.outputs.previous_tag }}"
            echo "Pulling LFS only for files we need (changed or new, LFS-tracked only) — unchanged files are copied from previous, no pull."
            mkdir -p dist-patch
            {
              git diff --name-only "$PREV" HEAD -- Data/ 2>/dev/null || true
              node scripts/list-new-lfs-paths.js prev-manifest.json 2>/dev/null || true
            } | sort -u > dist-patch/changed-paths-raw.txt
            node scripts/filter-lfs-paths.js dist-patch/changed-paths-raw.txt > dist-patch/lfs-changed-paths.txt
            LFS_COUNT=$(wc -l < dist-patch/lfs-changed-paths.txt | tr -d ' ')
            if [ -z "$LFS_COUNT" ] || [ "$LFS_COUNT" -eq 0 ]; then
              echo "No changed or new LFS files; no LFS pull needed"
            else
              node scripts/pull-lfs-for-path-list.js dist-patch/lfs-changed-paths.txt
              echo "Pulled LFS for $LFS_COUNT path(s) (changed + new; paths with spaces preserved)"
            fi
          fi

      - name: Pull all LFS and smudge Data/ (when force re-upload all)
        if: github.event.inputs.force_upload_all_small_assets == 'true'
        env:
          GIT_LFS_SKIP_SMUDGE: '0'
        run: |
          echo "Force re-upload: pulling all LFS so manifest + R2 see real file sizes."
          git lfs pull
          # Do NOT run "git checkout HEAD -- Data/" here: the tree stores LFS pointer blobs,
          # so checkout would overwrite the real files we just pulled with pointer files.
          # Verify at least one LFS file is real (not a pointer) so we fail fast
          MIN_BYTES=1000
          for f in Data/SKSE/Plugins/*.dll; do
            [ -f "$f" ] || continue
            sz=$(stat -c%s "$f" 2>/dev/null || stat -f%z "$f" 2>/dev/null)
            if [ -n "$sz" ] && [ "$sz" -gt "$MIN_BYTES" ]; then
              echo "OK: $f size $sz (real content)"
              exit 0
            fi
          done
          echo "ERROR: LFS pull may have left pointer files (no DLL in Data/SKSE/Plugins > $MIN_BYTES bytes)"
          exit 1

      - name: Build patch manifest
        run: |
          npm ci
          PREV_ARG=""
          if [ -f prev-manifest.json ]; then
            PREV_ARG="--previous-manifest=prev-manifest.json"
            if [ -n "${{ steps.version.outputs.previous_tag }}" ]; then
              echo "${{ steps.version.outputs.previous_tag }}" > prev-tag.txt
              PREV_ARG="$PREV_ARG --previous-tag=prev-tag.txt"
            fi
          fi
          node scripts/build-patch.js Data ${{ steps.version.outputs.version }} --prefix=Data $PREV_ARG
          echo "Built dist-patch/manifest.json"

      - name: Merge off-GitHub assets and patch notes into manifest
        run: |
          node -e "
            const fs = require('fs');
            const m = JSON.parse(fs.readFileSync('dist-patch/manifest.json', 'utf8'));
            const paths = new Set((m.files || []).map(f => (typeof f === 'string' ? f : f.path)));
            const offPath = 'scripts/off-github-assets.json';
            if (fs.existsSync(offPath)) {
              const off = JSON.parse(fs.readFileSync(offPath, 'utf8'));
              const list = Array.isArray(off) ? off : (off.assets || off.files || []);
              for (const e of list) {
                const pathEntry = e.path || e;
                if (!paths.has(pathEntry)) {
                  m.files.push({ path: pathEntry, size: e.size, hash: e.hash });
                  paths.add(pathEntry);
                }
              }
            }
            // Patch notes for manifest: prefer patch-notes.md, else release-notes.md
            // Strip leading \"Patch X.Y.Z\" so launcher doesn't show version twice (it shows version separately)
            const stripDuplicateVersion = (s) => s.replace(/^#?\s*Patch\s+[\d.]+\s*\n?/i, '').trimStart();
            const patchNotesPath = 'patch-notes.md';
            const releaseNotesPath = 'release-notes.md';
            if (fs.existsSync(patchNotesPath)) {
              let content = fs.readFileSync(patchNotesPath, 'utf8').trim();
              if (content) {
                m.patchNotes = stripDuplicateVersion(content);
                console.log('Merged patch notes from patch-notes.md into manifest');
              }
            } else if (fs.existsSync(releaseNotesPath)) {
              let content = fs.readFileSync(releaseNotesPath, 'utf8').trim();
              if (content) m.patchNotes = stripDuplicateVersion(content);
            }
            fs.writeFileSync('dist-patch/manifest.json', JSON.stringify(m, null, 2), 'utf8');
            console.log('Merged off-GitHub assets and patch notes into manifest');
          "

      - name: Build patch changelog
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PREVIOUS_VERSION: ${{ steps.version.outputs.previous_version }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "patch-notes.md for release ${{ steps.version.outputs.version }}:"
          head -20 patch-notes.md
          PREV_CHANGELOG=""
          if [ -f prev-changelog.json ]; then
            PREV_CHANGELOG="--prev-changelog=prev-changelog.json"
          fi
          node scripts/verify-patch-notes-for-release.js \
            "${{ steps.version.outputs.version }}" \
            "${{ steps.version.outputs.previous_version }}" \
            $PREV_CHANGELOG
          CHANGELOG_ARGS="${{ steps.version.outputs.version }} --release-date=$(date -u +%Y-%m-%d)"
          if [ -f prev-changelog.json ]; then
            CHANGELOG_ARGS="$CHANGELOG_ARGS --previous-changelog=prev-changelog.json"
          fi
          node scripts/build-changelog.js $CHANGELOG_ARGS
          node -e "
            const c = require('./dist-patch/changelog.json');
            console.log('Changelog latest:', c.latest, 'entries:', c.releases.length);
          "

      - name: Set manifest URLs and upload list
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          PATCH_ASSETS_PUBLIC_URL: ${{ secrets.PATCH_ASSETS_PUBLIC_URL }}
          PREV_TAG: ${{ steps.version.outputs.previous_tag }}
          FORCE_UPLOAD_ALL_SMALL_ASSETS: ${{ github.event.inputs.force_upload_all_small_assets == 'true' && '1' || '' }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          VERSION="${{ steps.version.outputs.version }}"
          export BASE="https://github.com/${{ github.repository }}/releases/download/${TAG}"
          export PATCH_ASSETS_PUBLIC_URL="${{ secrets.PATCH_ASSETS_PUBLIC_URL }}"
          export VERSION
          export PREV_TAG
          export GITHUB_REPOSITORY="${{ github.repository }}"
          [ -n "$FORCE_UPLOAD_ALL_SMALL_ASSETS" ] && echo "Force re-upload all small assets (fix pointer-on-previous)"
          node scripts/set-manifest-urls.js
          echo "Set manifest URLs; assets to upload: $(wc -l < dist-patch/github-assets-to-upload.txt 2>/dev/null || echo 0)"

      - name: Pull LFS for assets to upload (if still pointers)
        env:
          GIT_LFS_SKIP_SMUDGE: '0'
        run: node scripts/pull-lfs-for-upload-list.js
        # When previous release had different/missing assets, upload list is large; we only pull those LFS files here (no full fetch at checkout).

      - name: Prepare per-file assets for incremental download
        run: |
          node scripts/prepare-patch-assets.js Data --prefix=Data
          echo "Prepared $(ls dist-patch/assets 2>/dev/null | wc -l) assets for GitHub"

      - name: Pull LFS for R2 upload paths only (no pull for copy-from-previous)
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GIT_LFS_SKIP_SMUDGE: '0'
        run: |
          PREV_ARGS=""
          if [ -f prev-manifest.json ]; then
            PREV_ARGS="--previous-manifest=prev-manifest.json --previous-version=${{ steps.version.outputs.previous_version }}"
          fi
          mapfile -t R2_UPLOAD_PATHS < <(node scripts/list-r2-upload-paths.js $PREV_ARGS 2>/dev/null || true)
          if [ ${#R2_UPLOAD_PATHS[@]} -eq 0 ]; then
            echo "No R2 paths to upload from local (all will be copied from previous)"
          else
            echo "Pulling LFS for ${#R2_UPLOAD_PATHS[@]} path(s) that will be uploaded to R2 (batched, not copied):"
            mkdir -p dist-patch
            printf '%s\n' "${R2_UPLOAD_PATHS[@]}" > dist-patch/r2-upload-paths.txt
            node scripts/pull-lfs-for-path-list.js dist-patch/r2-upload-paths.txt
          fi

      - name: Upload R2 assets (LFS + oversized)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          PATCH_ASSETS_BUCKET: ${{ secrets.PATCH_ASSETS_BUCKET }}
          PATCH_ASSETS_ACCOUNT_ID: ${{ secrets.PATCH_ASSETS_ACCOUNT_ID }}
          PATCH_ASSETS_PUBLIC_URL: ${{ secrets.PATCH_ASSETS_PUBLIC_URL }}
          VERSION: ${{ steps.version.outputs.version }}
          GIT_LFS_SKIP_SMUDGE: '0'
          FORCE_UPLOAD_ALL_SMALL_ASSETS: ${{ github.event.inputs.force_upload_all_small_assets == 'true' && '1' || '' }}
          # Copy-from-previous issues ~15k+ CopyObject calls per release; low concurrency → long silent stretches.
          # 48 is a strong default with R2_MAX_SOCKETS=128; try 64 if stable, or drop to 24–32 on throttling / copy timeouts.
          R2_CONCURRENCY: 48
          R2_VERIFY_PUT_HEAD: '0'
          R2_MAX_SOCKETS: '128'
          R2_LOG_EACH_COPIED_ASSET: '0'
          R2_CONNECTION_TIMEOUT_MS: 120000
          R2_REQUEST_TIMEOUT_MS: 600000
          R2_COPY_DEADLINE_MS: 900000
          R2_MAX_ATTEMPTS: 4
        run: |
          PREV_ARGS=""
          if [ -f prev-manifest.json ]; then
            PREV_ARGS="--previous-manifest=prev-manifest.json --previous-version=${{ steps.version.outputs.previous_version }}"
          fi
          MAX_ATTEMPTS=3
          attempt=1
          while true; do
            if node scripts/upload-lfs-assets.js Data --prefix=Data $PREV_ARGS; then
              echo "R2 upload succeeded on attempt $attempt"
              break
            fi
            if [ "$attempt" -ge "$MAX_ATTEMPTS" ]; then
              echo "R2 upload failed after $MAX_ATTEMPTS attempts"
              exit 1
            fi
            echo "R2 assets upload attempt $attempt failed (ETIMEDOUT/ENETUNREACH possible). Retrying in 30s..."
            sleep 30
            attempt=$((attempt + 1))
          done

      - name: Purge Cloudflare cache for this patch (optional)
        continue-on-error: true
        env:
          VERSION: ${{ steps.version.outputs.version }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PATCH_ASSETS_PUBLIC_URL: ${{ secrets.PATCH_ASSETS_PUBLIC_URL }}
        run: node scripts/purge-cloudflare-patch-cache.js

      - name: Create or update release
        if: (github.event_name != 'workflow_dispatch' || (github.event_name == 'workflow_dispatch' && inputs.create_release_version != '')) && steps.version.outputs.version != steps.version.outputs.previous_version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          VERSION="${{ steps.version.outputs.version }}"
          MAX_ATTEMPTS=5

          run_release_api() {
            local attempt=1
            while [ "$attempt" -le "$MAX_ATTEMPTS" ]; do
              if "$@"; then
                return 0
              fi
              if gh release view "$TAG" &>/dev/null; then
                echo "Release $TAG exists after API error; continuing with edit/update"
                return 0
              fi
              if [ "$attempt" -eq "$MAX_ATTEMPTS" ]; then
                echo "GitHub release API failed after $MAX_ATTEMPTS attempts (HTTP 5xx is usually transient — re-run workflow)"
                return 1
              fi
              wait=$((attempt * 30))
              echo "GitHub release API failed (attempt $attempt/$MAX_ATTEMPTS); retrying in ${wait}s..."
              sleep "$wait"
              attempt=$((attempt + 1))
            done
          }

          if gh release view "$TAG" &>/dev/null; then
            echo "Release $TAG already exists; marking as latest and updating notes (use this to fix out-of-wack versions or re-upload assets)"
            run_release_api gh release edit "$TAG" --latest --notes-file release-notes.md --target "${{ github.sha }}"
          else
            echo "Creating release: $TAG (Patch $VERSION) at commit ${{ github.sha }}"
            run_release_api gh release create "$TAG" \
              --target "${{ github.sha }}" \
              --title "Patch $VERSION" \
              --notes-file release-notes.md \
              --latest
          fi
          echo "Release $TAG is latest"

      - name: Upload per-file assets, manifest.json, and changelog.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          # Manifest URLs and github-assets-to-upload.txt already set in earlier step
          # Upload manifest + changelog first so patcher/launcher can discover them
          gh release upload "$TAG" dist-patch/manifest.json dist-patch/changelog.json --clobber
          # Upload only assets listed in github-assets-to-upload.txt (empty list = 0 uploads, all point to previous)
          files=()
          if [ -f dist-patch/github-assets-to-upload.txt ]; then
            while IFS= read -r name; do
              [ -n "$name" ] && [ -f "dist-patch/assets/$name" ] && files+=("dist-patch/assets/$name")
            done < dist-patch/github-assets-to-upload.txt
          else
            while IFS= read -r -d '' f; do files+=("$f"); done < <(find dist-patch/assets -type f -print0 2>/dev/null || true)
          fi
          if [ "${#files[@]}" -gt 0 ]; then
            echo "Uploading ${#files[@]} assets to GitHub..."
            BATCH_SIZE=50
            for ((i=0; i<${#files[@]}; i+=BATCH_SIZE)); do
              batch=("${files[@]:i:BATCH_SIZE}")
              for attempt in 1 2 3; do
                if gh release upload "$TAG" "${batch[@]}" --clobber; then
                  break
                fi
                if [ "$attempt" -eq 3 ]; then
                  echo "Batch upload failed after 3 attempts"
                  exit 1
                fi
                echo "Rate limit? Retrying in 60s (attempt $attempt/3)..."
                sleep 60
              done
              if [ $((i + BATCH_SIZE)) -lt ${#files[@]} ]; then
                echo "Uploaded batch $((i/BATCH_SIZE + 1)); waiting 5s..."
                sleep 5
              fi
            done
          else
            echo "No assets to upload (unchanged point to previous release — copying)."
          fi
          echo "Uploaded manifest.json, changelog.json, and ${#files[@]} per-file assets to GitHub (R2 assets: LFS + oversized)"