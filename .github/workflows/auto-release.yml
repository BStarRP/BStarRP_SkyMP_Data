# Create a release with version from Conventional Commits when patch-content/ changes.
# fix: → PATCH, feat: → MINOR, BREAKING CHANGE / ! → MAJOR (https://www.conventionalcommits.org/)
# Builds patch-*.zip (only patch-content + manifest) and attaches it to the release.
# The launcher MUST use the patch-*.zip asset, NOT the source archive (which contains the full repo).
#
# Manual run (Actions → "Auto release on patch change" → Run workflow): updates the *latest*
# release with manifest.json + per-file assets for the new patcher (no version bump).

name: Auto release on patch change

on:
  push:
    branches: [main]
    paths:
      - 'patch-content/**'
  workflow_dispatch:

jobs:
  auto-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Determine version bump from commits
        id: bump
        if: github.event_name != 'workflow_dispatch'
        run: |
          set -e
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          LOG=$(git log "$LATEST_TAG..HEAD" --format="%s%n%b" -- patch-content/ || true)
          BUMP=patch
          # BREAKING CHANGE in body, or type! in subject (e.g. feat!:) → major
          if echo "$LOG" | grep -qi 'BREAKING CHANGE'; then
            BUMP=major
          elif echo "$LOG" | grep -qE '^[a-z]+!.*:'; then
            BUMP=major
          # feat: or feat(scope): → minor
          elif echo "$LOG" | grep -qE '^feat(\([^)]*\))?:'; then
            BUMP=minor
          # fix: or fix(scope): → patch
          elif echo "$LOG" | grep -qE '^fix(\([^)]*\))?:'; then
            BUMP=patch
          fi
          echo "bump=$BUMP" >> $GITHUB_OUTPUT
          echo "Bump type: $BUMP"

      - name: Get latest version and compute new version
        id: version
        run: |
          LATEST=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          VERSION=${LATEST#v}
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual run: using existing version $VERSION (tag $LATEST)"
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "tag=$LATEST" >> $GITHUB_OUTPUT
          else
            MAJOR=$(echo "$VERSION" | cut -d. -f1)
            MINOR=$(echo "$VERSION" | cut -d. -f2)
            PATCH=$(echo "$VERSION" | cut -d. -f3)
            [[ -z "$PATCH" ]] && PATCH=0
            case "${{ steps.bump.outputs.bump }}" in
              major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
              minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
              patch) PATCH=$((PATCH + 1)) ;;
            esac
            NEW_VERSION="$MAJOR.$MINOR.$PATCH"
            echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
            echo "tag=v$NEW_VERSION" >> $GITHUB_OUTPUT
            echo "New version: $NEW_VERSION"
          fi

      - name: Generate patch notes from commits
        id: notes
        if: github.event_name != 'workflow_dispatch'
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          VERSION="${{ steps.version.outputs.version }}"
          NOTES="# Patch $VERSION"$'\n\n'
          FEATURES=""
          FIXES=""
          BREAKING=""
          while IFS= read -r subject; do
            [[ -z "$subject" ]] && continue
            desc=$(echo "$subject" | sed -E 's/^[a-z]+(\([^)]*\))?!?:\s*//')
            if echo "$subject" | grep -qiE '^[a-z]+!.*:' || echo "$subject" | grep -qi 'BREAKING'; then
              BREAKING="$BREAKING- $desc"$'\n'
            elif echo "$subject" | grep -qE '^feat(\([^)]*\))?:'; then
              FEATURES="$FEATURES- $desc"$'\n'
            elif echo "$subject" | grep -qE '^fix(\([^)]*\))?:'; then
              FIXES="$FIXES- $desc"$'\n'
            else
              FIXES="${FIXES}- $subject"$'\n'
            fi
          done < <(git log "$LATEST_TAG..HEAD" --format="%s" --reverse -- patch-content/)
          [[ -n "$BREAKING" ]] && NOTES="${NOTES}### Breaking Changes"$'\n'"$BREAKING"$'\n'
          [[ -n "$FEATURES" ]] && NOTES="${NOTES}### Features"$'\n'"$FEATURES"$'\n'
          [[ -n "$FIXES" ]] && NOTES="${NOTES}### Fixes"$'\n'"$FIXES"
          echo "${NOTES}" > release-notes.md
          echo "Generated patch notes:"
          cat release-notes.md

      - name: Build patch zip
        run: |
          npm ci
          node scripts/build-patch.js patch-content ${{ steps.version.outputs.version }}
          echo "Built dist-patch/patch-${{ steps.version.outputs.version }}.zip"

      - name: Prepare per-file assets for incremental download
        run: |
          node scripts/prepare-patch-assets.js patch-content --prefix=Data
          echo "Prepared $(ls dist-patch/assets | wc -l) assets"

      - name: Create release with patch zip
        if: github.event_name != 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ steps.version.outputs.tag }} \
            --title "Patch ${{ steps.version.outputs.version }}" \
            --notes-file release-notes.md \
            --latest \
            dist-patch/patch-${{ steps.version.outputs.version }}.zip

      - name: Upload per-file assets and manifest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          VERSION="${{ steps.version.outputs.version }}"
          REPO="${{ github.repository }}"
          export BASE="https://github.com/${REPO}/releases/download/${TAG}"
          export ZIP_URL="${BASE}/patch-${VERSION}.zip"
          # Add url (and zipUrl) to manifest; only set url for size>0 (0-byte files skip upload → GitHub 400)
          node -e "
            const crypto = require('crypto');
            const fs = require('fs');
            const m = JSON.parse(fs.readFileSync('dist-patch/manifest.json', 'utf8'));
            const toAssetName = (p) => {
              const h = crypto.createHash('sha256').update(p, 'utf8').digest('hex').slice(0, 16);
              const i = p.lastIndexOf('.');
              return h + (i > 0 ? p.slice(i) : '');
            };
            m.files = m.files.map(f => ({
              ...f,
              url: (f.size > 0) ? (process.env.BASE + '/' + toAssetName(f.path)) : undefined
            }));
            m.zipUrl = process.env.ZIP_URL;
            fs.writeFileSync('dist-patch/manifest.json', JSON.stringify(m, null, 2), 'utf8');
          "
          # Upload manifest first so patcher can discover incremental mode
          gh release upload "$TAG" dist-patch/manifest.json --clobber
          # Upload ALL per-file assets in batches of 100
          files=()
          while IFS= read -r -d '' f; do files+=("$f"); done < <(find dist-patch/assets -type f -print0)
          for ((i=0; i<${#files[@]}; i+=100)); do
            batch=("${files[@]:i:100}")
            gh release upload "$TAG" "${batch[@]}" --clobber
          done
          # Verify: uploaded asset count = manifest entries with Data/ and size>0 (0-byte files have no asset)
          manifest_count=$(node -e "const m=require('./dist-patch/manifest.json'); const d='Data/'; console.log(m.files.filter(f=>(typeof f==='string'?f:f.path).startsWith(d) && (typeof f==='object'?f.size:1)>0).length)")
          if [ "${#files[@]}" -ne "$manifest_count" ]; then
            echo "ERROR: manifest has $manifest_count Data/ non-zero files but prepared ${#files[@]} assets"
            exit 1
          fi
          echo "Uploaded manifest.json and ${#files[@]} per-file assets for incremental download"