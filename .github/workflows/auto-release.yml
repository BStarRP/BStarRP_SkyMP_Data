# Create a release with version from Conventional Commits when Data/ changes.
# fix: → PATCH, feat: → MINOR, BREAKING CHANGE / ! → MAJOR (https://www.conventionalcommits.org/)
# Builds manifest.json + per-file assets (small on GitHub, large on R2). No zip; launcher uses incremental download only.
#
# Manual run (Actions → "Auto release on patch change" → Run workflow): updates the *latest*
# release with manifest.json + per-file assets for the new patcher (no version bump).

name: Auto release on patch change

on:
  push:
    branches: [main]
    paths:
      - 'Data/**'
      - 'scripts/off-github-assets.json'
      - 'patch-notes.md'
  workflow_dispatch:

jobs:
  auto-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          lfs: true

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Determine version bump from commits
        id: bump
        if: github.event_name != 'workflow_dispatch'
        run: |
          set -e
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          LOG=$(git log "$LATEST_TAG..HEAD" --format="%s%n%b" -- Data/ || true)
          BUMP=patch
          # BREAKING CHANGE in body, or type! in subject (e.g. feat!:) → major
          if echo "$LOG" | grep -qi 'BREAKING CHANGE'; then
            BUMP=major
          elif echo "$LOG" | grep -qE '^[a-z]+!.*:'; then
            BUMP=major
          # feat: or feat(scope): → minor
          elif echo "$LOG" | grep -qE '^feat(\([^)]*\))?:'; then
            BUMP=minor
          # fix: or fix(scope): → patch
          elif echo "$LOG" | grep -qE '^fix(\([^)]*\))?:'; then
            BUMP=patch
          fi
          echo "bump=$BUMP" >> $GITHUB_OUTPUT
          echo "Bump type: $BUMP"

      - name: Get latest version and compute new version
        id: version
        run: |
          LATEST=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          VERSION=${LATEST#v}
          echo "previous_tag=$LATEST" >> $GITHUB_OUTPUT
          echo "previous_version=$VERSION" >> $GITHUB_OUTPUT
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual run: using existing version $VERSION (tag $LATEST)"
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "tag=$LATEST" >> $GITHUB_OUTPUT
          else
            MAJOR=$(echo "$VERSION" | cut -d. -f1)
            MINOR=$(echo "$VERSION" | cut -d. -f2)
            PATCH=$(echo "$VERSION" | cut -d. -f3)
            [[ -z "$PATCH" ]] && PATCH=0
            case "${{ steps.bump.outputs.bump }}" in
              major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
              minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
              patch) PATCH=$((PATCH + 1)) ;;
            esac
            NEW_VERSION="$MAJOR.$MINOR.$PATCH"
            echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
            echo "tag=v$NEW_VERSION" >> $GITHUB_OUTPUT
            echo "New version: $NEW_VERSION"
          fi

      - name: Prepare patch notes from patch-notes.md
        id: notes
        run: |
          if [ -f patch-notes.md ]; then
            cp patch-notes.md release-notes.md
            echo "Using patch-notes.md for release and manifest notes"
          else
            echo "" > release-notes.md
            echo "No patch-notes.md found; using empty release notes"
          fi
          cat release-notes.md

      - name: Build patch manifest
        run: |
          npm ci
          node scripts/build-patch.js Data ${{ steps.version.outputs.version }}
          echo "Built dist-patch/manifest.json"

      - name: Merge off-GitHub assets and patch notes into manifest
        run: |
          node -e "
            const fs = require('fs');
            const m = JSON.parse(fs.readFileSync('dist-patch/manifest.json', 'utf8'));
            const paths = new Set((m.files || []).map(f => (typeof f === 'string' ? f : f.path)));
            const offPath = 'scripts/off-github-assets.json';
            if (fs.existsSync(offPath)) {
              const off = JSON.parse(fs.readFileSync(offPath, 'utf8'));
              const list = Array.isArray(off) ? off : (off.assets || off.files || []);
              for (const e of list) {
                const pathEntry = e.path || e;
                if (!paths.has(pathEntry)) {
                  m.files.push({ path: pathEntry, size: e.size, hash: e.hash });
                  paths.add(pathEntry);
                }
              }
            }
            // Patch notes for manifest: prefer patch-notes.md, else release-notes.md
            const patchNotesPath = 'patch-notes.md';
            const releaseNotesPath = 'release-notes.md';
            if (fs.existsSync(patchNotesPath)) {
              const content = fs.readFileSync(patchNotesPath, 'utf8').trim();
              if (content) {
                m.patchNotes = content;
                console.log('Merged patch notes from patch-notes.md into manifest');
              }
            } else if (fs.existsSync(releaseNotesPath)) {
              m.patchNotes = fs.readFileSync(releaseNotesPath, 'utf8').trim();
            }
            fs.writeFileSync('dist-patch/manifest.json', JSON.stringify(m, null, 2), 'utf8');
            console.log('Merged off-GitHub assets and patch notes into manifest');
          "

      - name: Prepare per-file assets for incremental download
        run: |
          node scripts/prepare-patch-assets.js Data --prefix=Data
          echo "Prepared $(ls dist-patch/assets 2>/dev/null | wc -l) assets for GitHub"

      - name: Fetch previous release manifest
        if: steps.version.outputs.version != steps.version.outputs.previous_version && steps.version.outputs.previous_tag != 'v0.0.0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "${{ steps.version.outputs.previous_tag }}" --pattern "manifest.json" --dir . --clobber
          mv manifest.json prev-manifest.json
          echo "Fetched previous manifest for ${{ steps.version.outputs.previous_tag }}"

      - name: Upload large assets to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          PATCH_ASSETS_BUCKET: ${{ secrets.PATCH_ASSETS_BUCKET }}
          PATCH_ASSETS_ACCOUNT_ID: ${{ secrets.PATCH_ASSETS_ACCOUNT_ID }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          PREV_ARGS=""
          if [ -f prev-manifest.json ]; then
            PREV_ARGS="--previous-manifest=prev-manifest.json --previous-version=${{ steps.version.outputs.previous_version }}"
          fi
          node scripts/upload-large-assets.js Data --prefix=Data $PREV_ARGS

      - name: Create release
        if: github.event_name != 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ steps.version.outputs.tag }} \
            --title "Patch ${{ steps.version.outputs.version }}" \
            --notes-file release-notes.md \
            --latest

      - name: Upload per-file assets and manifest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PATCH_ASSETS_PUBLIC_URL: ${{ secrets.PATCH_ASSETS_PUBLIC_URL }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          VERSION="${{ steps.version.outputs.version }}"
          REPO="${{ github.repository }}"
          export BASE="https://github.com/${REPO}/releases/download/${TAG}"
          export PATCH_ASSETS_PUBLIC_URL="${{ secrets.PATCH_ASSETS_PUBLIC_URL }}"
          export VERSION
          # Add url to manifest: large files → R2, others → GitHub. 0-byte files get no url. No zipUrl.
          node -e "
            const fs = require('fs');
            const path = require('path');
            const m = JSON.parse(fs.readFileSync('dist-patch/manifest.json', 'utf8'));
            const cfgPath = 'scripts/patch-upload-config.json';
            const cfg = fs.existsSync(cfgPath) ? JSON.parse(fs.readFileSync(cfgPath, 'utf8')) : { largeExtensions: [], largeFileSizeThresholdBytes: null };
            const largeExt = Array.isArray(cfg.largeExtensions) ? cfg.largeExtensions : [];
            const sizeThreshold = cfg.largeFileSizeThresholdBytes ?? null;
            const isLarge = (p, size) => largeExt.includes(path.extname(p).toLowerCase()) || (sizeThreshold != null && size >= sizeThreshold);
            const toAssetName = (p) => p.replace(/\//g, '_').replace(/[^a-zA-Z0-9_.-]/g, '_').replace(/_+/g, '_').replace(/^_|_$/g, '');
            const r2Base = process.env.PATCH_ASSETS_PUBLIC_URL ? (process.env.PATCH_ASSETS_PUBLIC_URL + '/patches/' + process.env.VERSION) : null;
            m.files = m.files.map(f => {
              const size = (typeof f === 'object' && f.size != null) ? f.size : 0;
              const pathEntry = typeof f === 'string' ? f : f.path;
              const url = size === 0 ? undefined : (r2Base && isLarge(pathEntry, size) ? r2Base + '/' + toAssetName(pathEntry) : process.env.BASE + '/' + toAssetName(pathEntry));
              return typeof f === 'string' ? { path: f, url } : { ...f, url };
            });
            if (m.hasOwnProperty('zipUrl')) delete m.zipUrl;
            fs.writeFileSync('dist-patch/manifest.json', JSON.stringify(m, null, 2), 'utf8');
          "
          # Upload manifest first so patcher can discover incremental mode
          gh release upload "$TAG" dist-patch/manifest.json --clobber
          # Upload only non-large per-file assets to GitHub (large ones are on R2)
          # Use small batches + delay to avoid GitHub secondary rate limit (HTTP 403)
          files=()
          while IFS= read -r -d '' f; do files+=("$f"); done < <(find dist-patch/assets -type f -print0 2>/dev/null || true)
          if [ "${#files[@]}" -gt 0 ]; then
            BATCH_SIZE=15
            for ((i=0; i<${#files[@]}; i+=BATCH_SIZE)); do
              batch=("${files[@]:i:BATCH_SIZE}")
              gh release upload "$TAG" "${batch[@]}" --clobber
              if [ $((i + BATCH_SIZE)) -lt ${#files[@]} ]; then
                echo "Uploaded batch $((i/BATCH_SIZE + 1)); waiting 5s to avoid rate limit..."
                sleep 5
              fi
            done
          fi
          # Verify: GitHub asset count = manifest entries that are Data/, size>0, and NOT large
          expected=$(node -e "
            const fs = require('fs');
            const path = require('path');
            const m = require('./dist-patch/manifest.json');
            const cfg = fs.existsSync('scripts/patch-upload-config.json') ? JSON.parse(fs.readFileSync('scripts/patch-upload-config.json','utf8')) : { largeExtensions: [], largeFileSizeThresholdBytes: null };
            const largeExt = Array.isArray(cfg.largeExtensions) ? cfg.largeExtensions : [];
            const sizeThreshold = cfg.largeFileSizeThresholdBytes ?? null;
            const isLarge = (p, size) => largeExt.includes(path.extname(p).toLowerCase()) || (sizeThreshold != null && size >= sizeThreshold);
            const d = 'Data/';
            console.log(m.files.filter(f => { const p = typeof f === 'string' ? f : f.path; const s = typeof f === 'object' && f.size != null ? f.size : 1; return p.startsWith(d) && s > 0 && !isLarge(p, s); }).length);
          ")
          if [ "${#files[@]}" -ne "$expected" ]; then
            echo "ERROR: expected $expected non-large Data/ assets for GitHub but prepared ${#files[@]}"
            exit 1
          fi
          echo "Uploaded manifest.json and ${#files[@]} per-file assets to GitHub (large assets on R2)"