# Scan R2 with S3 HEAD (no full file download), then re-upload only objects whose size
# differs from manifest.json or are missing. Cheaper than "Force re-upload ALL assets".
#
# Actions → Repair R2 manifest mismatches → Run workflow
# Optional: set release tag (e.g. v0.31.0, v0.31.0-dev, or floating "dev-latest").
# Leave empty to use the latest *prod* GitHub release (/releases/latest).

name: Repair R2 manifest mismatches

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to repair (e.g. v0.31.0, v0.31.0-dev, or dev-latest). Empty = latest prod release.'
        required: false
        type: string

jobs:
  repair:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # R2 uses Cloudflare; runners often fail IPv6 (ENETUNREACH) or time out parallel connects — prefer IPv4.
      NODE_OPTIONS: --dns-result-order=ipv4first
    steps:
      - name: Resolve release tag
        id: rel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          set -e
          if [ -z "$INPUT_TAG" ]; then
            # Latest non-prerelease (prod). Never resolves to -dev / floating "dev-latest".
            TAG=$(gh release view --repo "${{ github.repository }}" --json tagName -q .tagName)
          elif [ "$INPUT_TAG" = "dev-latest" ] || [ "$INPUT_TAG" = "dev" ]; then
            # "dev" kept as a legacy alias for the floating pointer tag name.
            TAG=dev-latest
          else
            T="${INPUT_TAG#v}"
            TAG="v${T}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Repairing release $TAG"

      # Default branch has scripts/verify-r2-vs-manifest.js etc. A tag points at an older commit
      # that does not include those files — so we must not checkout only the tag.
      - name: Checkout default branch (scripts + package.json)
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          fetch-tags: false
          lfs: false

      - name: Restore Data/ from the release tag being repaired
        run: |
          set -e
          TAG="${{ steps.rel.outputs.tag }}"
          # One tag tip only — do not fetch full history / all tags.
          git fetch --force --no-tags --depth=1 origin "refs/tags/${TAG}:refs/tags/${TAG}"
          git checkout "$TAG" -- Data/

      - name: Setup Git LFS (no fetch)
        run: git lfs install --local

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Download manifest from release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist-patch
          gh release download "${{ steps.rel.outputs.tag }}" --repo "${{ github.repository }}" \
            --pattern "manifest.json" --dir dist-patch --clobber
          test -f dist-patch/manifest.json
          # VERSION must match the CDN folder (manifest.version), especially for floating tag "dev-latest"
          VER=$(node -e "console.log(JSON.parse(require('fs').readFileSync('dist-patch/manifest.json','utf8')).version || '')")
          if [ -z "$VER" ]; then
            echo "ERROR: dist-patch/manifest.json missing version"
            exit 1
          fi
          echo "version=$VER" >> $GITHUB_OUTPUT
          echo "Using CDN/R2 version $VER (tag ${{ steps.rel.outputs.tag }})"
        id: man

      - name: npm ci
        run: npm ci

      - name: Audit R2 vs manifest (HEAD only)
        id: audit
        env:
          VERSION: ${{ steps.man.outputs.version }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          PATCH_ASSETS_BUCKET: ${{ secrets.PATCH_ASSETS_BUCKET }}
          PATCH_ASSETS_ACCOUNT_ID: ${{ secrets.PATCH_ASSETS_ACCOUNT_ID }}
          PATCH_ASSETS_PUBLIC_URL: ${{ secrets.PATCH_ASSETS_PUBLIC_URL }}
          R2_VERIFY_PUBLIC_HEAD: '1'
          R2_CONCURRENCY: 4
          R2_VERIFY_PUT_HEAD: '0'
          R2_MAX_SOCKETS: '128'
          R2_CONNECTION_TIMEOUT_MS: 120000
          R2_REQUEST_TIMEOUT_MS: 600000
          R2_MAX_ATTEMPTS: 4
        run: |
          set -e
          MAX_ATTEMPTS=3
          attempt=1
          while [ "$attempt" -le "$MAX_ATTEMPTS" ]; do
            if node scripts/verify-r2-vs-manifest.js --manifest=dist-patch/manifest.json --out=dist-patch/r2-repair-paths.txt; then
              if [ -s dist-patch/r2-repair-paths.txt ]; then
                n=$(wc -l < dist-patch/r2-repair-paths.txt | tr -d ' ')
              else
                n=0
              fi
              echo "mismatch_count=$n" >> $GITHUB_OUTPUT
              echo "Paths needing repair: $n"
              exit 0
            fi
            if [ "$attempt" -ge "$MAX_ATTEMPTS" ]; then
              echo "R2 audit failed after $MAX_ATTEMPTS attempts (ETIMEDOUT/ENETUNREACH to Cloudflare)"
              exit 1
            fi
            echo "R2 audit attempt $attempt failed; retrying in 30s..."
            sleep 30
            attempt=$((attempt + 1))
          done

      - name: Pull LFS for repair list
        if: steps.audit.outputs.mismatch_count != '0'
        run: node scripts/pull-lfs-for-path-list.js dist-patch/r2-repair-paths.txt

      - name: Re-upload mismatched objects to R2
        if: steps.audit.outputs.mismatch_count != '0'
        env:
          VERSION: ${{ steps.man.outputs.version }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          PATCH_ASSETS_BUCKET: ${{ secrets.PATCH_ASSETS_BUCKET }}
          PATCH_ASSETS_ACCOUNT_ID: ${{ secrets.PATCH_ASSETS_ACCOUNT_ID }}
          PATCH_ASSETS_PUBLIC_URL: ${{ secrets.PATCH_ASSETS_PUBLIC_URL }}
          R2_CONCURRENCY: 4
          R2_VERIFY_PUT_HEAD: '0'
          R2_MAX_SOCKETS: '128'
          R2_CONNECTION_TIMEOUT_MS: 120000
          R2_REQUEST_TIMEOUT_MS: 600000
          R2_COPY_DEADLINE_MS: 900000
          R2_MAX_ATTEMPTS: 4
        run: |
          MAX_ATTEMPTS=3
          attempt=1
          while [ "$attempt" -le "$MAX_ATTEMPTS" ]; do
            if node scripts/upload-lfs-assets.js Data --prefix=Data --only-r2-paths=dist-patch/r2-repair-paths.txt; then
              exit 0
            fi
            if [ "$attempt" -ge "$MAX_ATTEMPTS" ]; then
              exit 1
            fi
            echo "R2 upload attempt $attempt failed; retrying in 30s..."
            sleep 30
            attempt=$((attempt + 1))
          done

      - name: Publish manifest if upload adjusted entries
        if: steps.audit.outputs.mismatch_count != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ steps.rel.outputs.tag }}" dist-patch/manifest.json \
            --repo "${{ github.repository }}" --clobber
          # Keep floating "dev-latest" pointer in sync when repairing a versioned -dev release
          VER="${{ steps.man.outputs.version }}"
          case "$VER" in
            *-dev|*-dev.*)
              if gh release view dev-latest --repo "${{ github.repository }}" &>/dev/null; then
                gh release upload dev-latest dist-patch/manifest.json \
                  --repo "${{ github.repository }}" --clobber || true
              fi
              ;;
          esac

      - name: Purge Cloudflare cache for this patch (optional)
        if: steps.audit.outputs.mismatch_count != '0'
        continue-on-error: true
        env:
          VERSION: ${{ steps.man.outputs.version }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PATCH_ASSETS_PUBLIC_URL: ${{ secrets.PATCH_ASSETS_PUBLIC_URL }}
        run: node scripts/purge-cloudflare-patch-cache.js

      - name: Summary
        if: always()
        run: |
          echo "tag=${{ steps.rel.outputs.tag }} version=${{ steps.man.outputs.version }}"
          echo "mismatch_count=${{ steps.audit.outputs.mismatch_count }}"
          if [ "${{ steps.audit.outputs.mismatch_count }}" = "0" ]; then
            echo "All R2 objects matched manifest sizes; no uploads."
          fi
